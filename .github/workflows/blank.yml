name: Build KovickMapper APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build KovickMapper APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch wireless ADB pairing engine
        run: |
          git clone --depth 1 https://github.com/xswl369/android-wireless-debug.git wirelessdebug
          sed -i "s/id 'com.android.library'/id 'com.android.library'/" wirelessdebug/build.gradle
          sed -i "s/compileSdk 34/compileSdk 35/" wirelessdebug/build.gradle
          sed -i "s/sourceCompatibility JavaVersion.VERSION_1_8/sourceCompatibility JavaVersion.VERSION_17/" wirelessdebug/build.gradle
          sed -i "s/targetCompatibility JavaVersion.VERSION_1_8/targetCompatibility JavaVersion.VERSION_17/" wirelessdebug/build.gradle
          sed -i "/api 'androidx.appcompat:appcompat:1.6.1'/a\\    implementation 'androidx.core:core-ktx:1.15.0'" wirelessdebug/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android SDK
        run: |
          command -v sdkmanager
          sdkmanager --list_installed | head -n 80

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KovickMapper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
